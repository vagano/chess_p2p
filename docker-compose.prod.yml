services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: p2p_chess_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-p2p_chess}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Go Backend (API, signaling, bot) ────────────────────────
  backend:
    build: ./backend
    container_name: p2p_chess_backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-p2p_chess}?sslmode=disable"
      STOCKFISH_WORKER_URL: "http://stockfish-worker:9000"
      FRONTEND_URL: "https://${DOMAIN:?Set DOMAIN in .env}"

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_WEBAPP_URL: "https://${DOMAIN}/tma"
      TELEGRAM_WEBHOOK_URL: "https://${DOMAIN}/bot/webhook"
      SKIP_TG_AUTH: "false"

      CORS_ORIGINS: "https://${DOMAIN}"

      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      RATE_LIMIT_EVALUATE_RPS: "${RATE_LIMIT_EVALUATE_RPS:-2}"
      RATE_LIMIT_EVALUATE_BURST: "${RATE_LIMIT_EVALUATE_BURST:-5}"
      RATE_LIMIT_API_RPM: "${RATE_LIMIT_API_RPM:-60}"
      RATE_LIMIT_API_BURST: "${RATE_LIMIT_API_BURST:-10}"
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── CRDT Server (hocuspocus) ────────────────────────────────
  crdt-server:
    build: ./services/crdt-server
    container_name: p2p_chess_crdt
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-p2p_chess}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ── Stockfish Worker (Go) ───────────────────────────────────
  stockfish-worker:
    build: ./services/stockfish-worker
    container_name: p2p_chess_stockfish
    restart: unless-stopped
    environment:
      PORT: "9000"
      STOCKFISH_PATH: "/usr/games/stockfish"
    networks:
      - internal

  # ── Web Frontend (init container) ──────────────────────────
  web-init:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: p2p_chess_web_init
    environment:
      CONNECTION_MODE: "hybrid"
    volumes:
      - frontend_dist:/srv

  # ── TMA Frontend (init container) ──────────────────────────
  tma-init:
    build:
      context: .
      dockerfile: apps/tma/Dockerfile
    container_name: p2p_chess_tma_init
    environment:
      TG_BOT_USERNAME: ${TG_BOT_USERNAME:-}
      TG_APP_NAME: ${TG_APP_NAME:-}
    volumes:
      - frontend_dist:/srv

  # ── Caddy (TLS + static + reverse proxy) ───────────────────
  caddy:
    image: caddy:2-alpine
    container_name: p2p_chess_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web-init:
        condition: service_completed_successfully
      tma-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
      crdt-server:
        condition: service_started
    networks:
      - internal

volumes:
  pgdata:
  frontend_dist:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge

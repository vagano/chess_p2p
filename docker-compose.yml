services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: p2p_chess_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: p2p_chess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Go Backend ───────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: p2p_chess_backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/p2p_chess?sslmode=disable"
      STOCKFISH_PATH: "stockfish"
      FRONTEND_URL: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend (Hybrid mode — default) ─────────────────────────
  # P2P primary, WebSocket fallback.
  # Change CONNECTION_MODE to switch: "p2p", "websocket", "hybrid"
  frontend:
    build: ./frontend
    container_name: p2p_chess_frontend
    ports:
      - "3000:80"
    environment:
      # ── Connection mode: "p2p" | "websocket" | "hybrid" ──
      CONNECTION_MODE: "hybrid"
      # URLs are auto-detected from browser location when empty.
      # Set explicitly only for non-standard deployments:
      # WS_SERVER_URL: "ws://localhost:3000"
      # SIGNALING_SERVERS: '["ws://localhost:3000/signaling"]'
      # API_BASE_URL: "http://localhost:3000"
    depends_on:
      - backend

volumes:
  pgdata:

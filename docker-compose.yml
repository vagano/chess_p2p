services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: p2p_chess_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: p2p_chess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Go Backend (API, signaling, bot) ────────────────────────
  backend:
    build: ./backend
    container_name: p2p_chess_backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/p2p_chess?sslmode=disable"
      STOCKFISH_WORKER_URL: "http://stockfish-worker:9000"
      FRONTEND_URL: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy

  # ── CRDT Server (hocuspocus) ────────────────────────────────
  crdt-server:
    build: ./services/crdt-server
    container_name: p2p_chess_crdt
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/p2p_chess?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Stockfish Worker ────────────────────────────────────────
  stockfish-worker:
    build: ./services/stockfish-worker
    container_name: p2p_chess_stockfish
    ports:
      - "9000:9000"
    environment:
      PORT: "9000"
      STOCKFISH_PATH: "/usr/games/stockfish"

volumes:
  pgdata:
